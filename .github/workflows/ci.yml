name: CI

# Blocking merge gate. Every job is CPU-only (or SwiftShader-tolerant) so it is
# deterministic on GitHub-hosted runners. GPU-fragile rendered-frame comparisons
# live in golden.yml and are intentionally NOT part of this gate.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Tier: static ── typecheck + lint + i18n
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/ci.sh static

  # ── Tier: unit ── web unit + component tests
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/ci.sh unit

  # ── Tier: integration-web ── vitest integration + golden-helper unit tests
  integration-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/ci.sh integration-web

  # ── Tier: rust ── clippy + fmt + full Rust suite (native unit/integration +
  # logic parity). The GPU golden test skips gracefully here (no REQUIRE gate).
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.87.0
        with:
          components: clippy, rustfmt
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libavdevice-dev libvulkan1 mesa-vulkan-drivers
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/ci.sh rust

  # ── Tier: e2e-smoke ── engine-agnostic startup checks (Docker/SwiftShader)
  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke tier in Docker
        run: bash scripts/ci.sh e2e-smoke
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: playwright-report/
          retention-days: 7

  # ── Tier: e2e ── full UI workflows (Docker/SwiftShader)
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run e2e tier in Docker
        run: bash scripts/ci.sh e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: playwright-report/
          retention-days: 7
