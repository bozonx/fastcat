name: CI

# Blocking web and native checks. Playwright and GPU tiers remain manual.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Tier: static ── typecheck + lint + i18n
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Setup Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-static-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-static-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-turbo-
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/ci.sh static

  # ── Tier: unit ── web unit + component tests + logic parity
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Setup Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-unit-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-unit-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-turbo-
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/ci.sh unit

  # ── Tier: integration-web ── web integration tests
  integration-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Setup Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-integration-web-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-integration-web-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-turbo-
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/ci.sh integration-web

  # ── Tier: native ── Rust unit, integration and logic-parity tests
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Setup Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/native/src-tauri/target
          key: ${{ runner.os }}-cargo-native-${{ hashFiles('apps/native/src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-native-${{ hashFiles('apps/native/src-tauri/Cargo.lock') }}-
      - run: pnpm install --frozen-lockfile
      - name: Expose shared native test fixtures
        run: ln -s ../web/test apps/native/test
      - run: bash scripts/ci.sh native
