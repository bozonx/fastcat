services:
  fastcat:
    image: node:24-alpine
    container_name: fastcat
    restart: always
    working_dir: /app
    command: >
      sh -c "corepack enable && pnpm install --frozen-lockfile && if [ \"$NUXT_PUBLIC_DEV_MODE\" = \"true\" ]; then
        pnpm dev;
      else
        pnpm prod;
      fi "
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - .:/app
    environment:
      - NUXT_PUBLIC_DEV_MODE=false
      - NUXT_APP_BASE_URL=/
      - NUXT_PUBLIC_BLOGGER_DOG_API_URL=https://api.bloggerdog.pro
      - NUXT_PUBLIC_BLOGGER_DOG_UI_URL=https://bloggerdog.pro
      - NUXT_PUBLIC_FASTCAT_ACCOUNT_API_URL=https://user-account.fastcat.video
      - NUXT_PUBLIC_FASTCAT_ACCOUNT_UI_URL=https://user-account.fastcat.video/ui
      - PORT=3000

  # Playwright e2e test runner.
  # Image version must match the installed @playwright/test version in package.json.
  playwright:
    image: mcr.microsoft.com/playwright:v1.58.2-jammy
    container_name: fastcat-playwright
    profiles:
      - e2e
    working_dir: /app
    ipc: host
    volumes:
      - .:/app
      # Write generated artefacts into named Docker volumes instead of the host
      # so the container (running as root) does not leave root-owned files in the repo.
      - playwright_node_modules:/app/node_modules
      - playwright_nuxt:/app/.nuxt
      - playwright_output:/app/.output
    environment:
      - CI=true
      - E2E_TEST=1
      - E2E_PORT=3008

volumes:
  playwright_node_modules:
  playwright_nuxt:
  playwright_output:
