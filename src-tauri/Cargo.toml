[package]
name = "fastcat"
version = "0.5.2"
description = "FastCat video editor"
authors = []
license = ""
repository = ""
edition = "2021"
rust-version = "1.87.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
# --- runtime / utility ---
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
pollster = "0.4.0"
anyhow = "1"
thiserror = "2"
parking_lot = "0.12"
bytemuck = { version = "1.16", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
once_cell = "1"
cpal = "0.17.3"
symphonia = { version = "0.5.4", features = ["all"] }
rubato = "0.16.0"
lru = "0.12"
thread-priority = "1.2"

# --- Tauri ---
tauri = { version = "2.11.2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
tauri-plugin-fs-stream = "2.0.0"
tauri-plugin-log = "2.8.0"
tauri-plugin-os = "2"
tauri-plugin-persisted-scope = "2.3.7"

# --- GPU / compositor stack ---
wgpu = { version = "29.0.3", default-features = false, features = ["dx12", "gles", "metal", "std", "vulkan", "wgsl"] }
vello = "0.9"
vello_svg = "0.9"
peniko = "0.6"
kurbo = "0.13"
# Text shaping/layout — Linebender stack, тот же что и Vello.
parley = "0.9"
# Растр-декод для image-слоёв (PNG/JPEG/WebP). Видеокадры приходят отдельно от декодера.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
raw-window-handle = "0.6"
# Нативный монитор: окно + декодер.
winit = "0.30"
resvg = "0.46.0"
# Preview/monitor decode uses libav via ffmpeg-next. Export/proxy/convert still use system ffmpeg CLI.
ffmpeg-next = "8.1.0"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.4.2"
