[package]
name = "fastcat"
version = "0.5.2"
description = "FastCat video editor"
edition = "2021"
rust-version = "1.88.0"
default-run = "fastcat"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }
serde_json = "1.0"

[dependencies]
# --- runtime / utility ---
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
ts-rs = "10.1"
log = "0.4"
pollster = "0.4.0"
anyhow = "1"
parking_lot = "0.12"
bytemuck = { version = "1.16", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
cpal = "0.17.3"
symphonia = { version = "0.5.4", features = ["all"] }
rubato = "0.16.0"
lru = "0.12"

# --- Tauri ---
tauri = { version = "2.11.2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
tauri-plugin-fs-stream = "2.0.0"
tauri-plugin-log = "2.8.0"
tauri-plugin-os = "2"

# --- GPU / compositor stack ---
wgpu = { version = "29.0.3", default-features = false, features = ["dx12", "gles", "metal", "std", "vulkan", "wgsl"] }
vello = "0.9"
vello_svg = "0.9"
peniko = "0.6"
kurbo = "0.13"
# Text shaping/layout — Linebender stack, same as Vello.
parley = "0.9"
# Raster decode for image layers (PNG/JPEG/WebP). Video frames arrive separately from the decoder.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
raw-window-handle = "0.6"
# Native monitor: window + decoder.
winit = "0.30"
resvg = "0.46.0"
# Preview/monitor decode uses libav via ffmpeg-next. Export/proxy/convert still use system ffmpeg CLI.
ffmpeg-next = "8.1.0"
ffmpeg-sys-next = "8.1.0"
libc = "0.2"
webp = "0.3.1"
# CLAP audio plugin host (safe wrapper over clap-sys). clack-extensions needs
# the `clack-host` feature to expose host-side extension wrappers (audio-ports).
clack-host = "0.1.0"
clack-common = "0.1.0"
clack-extensions = { version = "0.1.0", default-features = false, features = ["clack-host", "audio-ports", "latency"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.4.2"

[features]
# Exposes in-crate test doubles / offline helpers (mock audio backend,
# scene→PCM render) to external integration tests under `tests/`.
test-support = []

[dev-dependencies]
tempfile = "3"
serde_json = "1.0"
# Same version wgpu already pulls in — used only to validate shared WGSL in tests.
naga = { version = "29", features = ["wgsl-in"] }
